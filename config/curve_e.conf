# ========================================================
# 1. ZMK STUDIO (Live GUI Keymap Editing)
# ========================================================
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# ========================================================
# 2. ROTARY ENCODER
# ========================================================
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ========================================================
# 3. BLUETOOTH ENHANCEMENTS
# ========================================================
# Tăng công suất phát sóng Bluetooth lên mức tối đa (+8dBm) để sóng siêu khỏe, không lag
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Hỗ trợ tối đa 5 thiết bị Bluetooth
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

# Bật tính năng tối ưu BLE mới nhất
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# ========================================================
# 4. POWER MANAGEMENT (TIẾT KIỆM PIN & BÁO PIN CHUẨN)
# ========================================================
# Bật tính năng ngủ sâu (Deep Sleep)
CONFIG_ZMK_SLEEP=y
# Ngủ tạm thời sau 30 giây không bấm (30000 ms)
CONFIG_ZMK_IDLE_TIMEOUT=30000
# Ngủ sâu ngắt kết nối sau 30 phút không dùng (1800000 ms) để giữ pin tối đa
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Báo cáo chuẩn xác phần trăm pin qua Bluetooth
CONFIG_ZMK_BATTERY_REPORTING=y

# ========================================================
# 5. DEBOUNCE TUNING (TỐI ƯU ĐỘ NHẠY VÀ CHỐNG CHẬP PHÍM)
# ========================================================
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
