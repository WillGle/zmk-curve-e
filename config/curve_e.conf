# ========================================================
# 1. ZMK STUDIO (Live GUI Keymap & Layer Remapping on Web)
# ========================================================
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Full rollover in report mode; USB hosts can request the 6-key boot protocol.
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
CONFIG_ZMK_USB_BOOT=y

# ========================================================
# 2. ROTARY ENCODER
# ========================================================
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ========================================================
# 3. MOUSE EMULATION & POINTING DEVICE SUPPORT
# ========================================================
CONFIG_ZMK_POINTING=y

# ========================================================
# 4. BLUETOOTH CONNECTION PREFERENCES
# ========================================================
# Yêu cầu công suất phát +8 dBm; chất lượng sóng và mức tiêu thụ cần đo thực tế.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Yêu cầu chu kỳ kết nối 7.5–15 ms; host quyết định giá trị thực.
# Không bỏ qua connection event theo peripheral latency.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Quản lý tối đa 5 thiết bị Bluetooth
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

# Use explicit compatibility settings instead of the experimental security bundle.
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=n
# ZMK recommends disabling 2M PHY for compatibility with affected host chipsets.
CONFIG_BT_CTLR_PHY_2M=n

# Pair without typing a passkey; keep this explicit when updating ZMK.
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

# ========================================================
# 5. SMART POWER MANAGEMENT (TIẾT KIỆM PIN THÔNG MINH)
# ========================================================
# Bật tính năng ngủ sâu (Deep Sleep)
CONFIG_ZMK_SLEEP=y
# Chuyển trạng thái idle sau 30 giây không hoạt động.
CONFIG_ZMK_IDLE_TIMEOUT=30000
# Yêu cầu sleep sau 30 phút; dòng ngủ và thời gian thức dậy chưa đo.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Bật báo pin qua Bluetooth; độ chính xác phụ thuộc cầu chia áp và pin.
CONFIG_ZMK_BATTERY_REPORTING=y

# ========================================================
# 6. DEBOUNCE TIMING
# ========================================================
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# ========================================================
# 7. COMBO PERFORMANCE TUNING
# ========================================================
# Số combo/phím và số phím/combo được ZMK tự tính từ devicetree.
CONFIG_ZMK_COMBO_MAX_PRESSED_COMBOS=8
